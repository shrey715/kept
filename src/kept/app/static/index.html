<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #1f5fbf; --green: #1e7a46; --amber: #a35c00; --red: #b3261e; --soft: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e24; --ink: #e8eaed; --muted: #9aa3ae; --line: #2c313a;
      --accent: #7aa7f0; --green: #5cc58a; --amber: #f0a64a; --red: #f28b82; --soft: #232831;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  header h1 { font-size: 18px; margin: 0 16px 0 0; align-self: center; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  input, select, button, textarea { font: inherit; color: inherit; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { display: grid; gap: 16px; padding: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .headline { font-size: 20px; font-weight: 600; margin: 4px 0 8px; }
  .tier { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .tier.green { color: var(--green); } .tier.amber { color: var(--amber); } .tier.red, .tier.blocked { color: var(--red); }
  .banner { padding: 8px 10px; border-radius: 6px; margin: 8px 0; background: var(--soft); border-left: 4px solid var(--amber); }
  .banner.stop { border-left-color: var(--red); }
  .muted { color: var(--muted); font-size: 13px; }
  ul.clean { list-style: none; padding: 0; margin: 0; }
  ul.clean li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  ul.clean li:last-child { border-bottom: 0; }
  .bar { display: grid; grid-template-columns: 11em 1fr 3.5em; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  .bar span.track { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar span.fill { display: block; height: 100%; background: var(--accent); }
  .ok::before { content: "\2713  "; color: var(--green); font-weight: 700; }
  .no::before { content: "\2717  "; color: var(--red); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 10px; }
  pre { background: var(--soft); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .stack { display: grid; gap: 16px; align-content: start; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Kept</h1>
  <label>Case <input id="case" value="C-118204" size="16"></label>
  <label>User <input id="user" value="agent-7" size="10"></label>
  <label>Role
    <select id="role">
      <option>agent</option><option>hardship_specialist</option><option>team_lead</option>
      <option>compliance</option><option>analyst</option><option>data_steward</option>
    </select>
  </label>
  <button id="load">Open case</button>
</header>
<main>
  <section aria-live="polite">
    <h2>Next best action</h2>
    <div id="card" class="muted">Open a case to see its card.</div>
  </section>
  <div class="stack">
    <section>
      <h2>Collections Ask</h2>
      <form id="askform" class="row">
        <label style="flex:1">Question <input id="question" placeholder="Promise kept rate by product last 90 days"></label>
        <button>Ask</button>
      </form>
      <div id="answer" class="muted" aria-live="polite"></div>
    </section>
    <section>
      <h2>Steward queue</h2>
      <button class="ghost" id="loadqueue">Load queue</button>
      <div id="queue" class="muted"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const who = () => ({ user_id: $("user").value.trim(), role: $("role").value });
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
const nice = (s) => (s || "").replaceAll("_", " ");

async function call(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : r.statusText);
  return body;
}

async function loadCard() {
  const box = $("card");
  box.replaceChildren(el("p", "Loading...", "muted"));
  const q = new URLSearchParams(who());
  try {
    renderCard(await call(`/cases/${encodeURIComponent($("case").value.trim())}/nba?${q}`));
  } catch (e) { box.replaceChildren(el("p", `Couldn't open the case: ${e.message}`, "no")); }
}

function renderCard(c) {
  const box = $("card"); box.replaceChildren(); box.className = "";
  if (c.hard_stop && c.hard_stop.blocked) box.append(el("div", c.hard_stop.rule_card, "banner stop"));
  if (c.hardship_banner) box.append(el("div", c.hardship_banner, "banner"));
  const head = el("div", c.headline, "headline"); box.append(head);
  const p = c.proposal;
  if (p) {
    const meta = el("p"); meta.append(el("span", p.tier, `tier ${p.tier}`), document.createTextNode(
      `  ${nice(p.action)}${p.window_start ? `, ${fmtTime(p.window_start)} to ${fmtTime(p.window_end)} (your time)` : ""}` +
      (p.is_legacy_strategy ? "  - old strategy" : "")));
    box.append(meta);
  } else if (c.no_action_reason) box.append(el("p", c.no_action_reason, "muted"));
  if (c.sizing_text) box.append(el("p", c.sizing_text));
  if (c.reasons && c.reasons.length) {
    box.append(el("h2", "Why"));
    const ul = el("ul", null, "clean");
    c.reasons.forEach((r) => ul.append(el("li", `${r.sentence}  (+${r.contribution_pts.toFixed(1)} pts)`)));
    box.append(ul);
  }
  if (c.probabilities && c.probabilities.length) {
    box.append(el("h2", "Chance of payment in 14 days"));
    c.probabilities.forEach((a) => {
      const row = el("div", null, "bar"), track = el("span", null, "track"), fill = el("span", null, "fill");
      fill.style.width = `${Math.round(a.p_paid_14d * 100)}%`; track.append(fill);
      row.append(el("span", nice(a.action)), track, el("span", `${Math.round(a.p_paid_14d * 100)}%`));
      box.append(row);
    });
  }
  if (c.similar_cases_text) box.append(el("p", c.similar_cases_text, "muted"));
  if (c.checks && c.checks.length) {
    box.append(el("h2", "Checks"));
    const ul = el("ul", null, "clean");
    c.checks.forEach((k) => ul.append(el("li", `${nice(k.check)}: ${k.detail}`, k.passed ? "ok" : "no")));
    box.append(ul);
  }
  box.append(el("p", `Model ${c.model_version} - features as of ${new Date(c.features_as_of).toLocaleString()}`, "muted"));
  if (p) box.append(releasePanel(p));
}

function releasePanel(p) {
  const wrap = el("div"); wrap.append(el("h2", "Review"));
  const row = el("div", null, "row");
  const second = el("input"); second.placeholder = "second reviewer id"; second.size = 14;
  const secondRole = el("select"); ["", "hardship_specialist", "team_lead", "compliance"].forEach((r) => secondRole.append(el("option", r)));
  const reason = el("input"); reason.placeholder = "override reason"; reason.size = 18;
  const out = el("p", null, "muted"); out.setAttribute("aria-live", "polite");
  const decide = async (decision) => {
    const body = { proposal_id: p.proposal_id, reviewer_id: who().user_id, reviewer_role: who().role, decision, decided_at: new Date().toISOString() };
    if (second.value.trim()) { body.second_reviewer_id = second.value.trim(); body.second_reviewer_role = secondRole.value || null; }
    if (decision === "override") body.override_reason = reason.value.trim();
    try {
      const r = await call(`/proposals/${encodeURIComponent(p.proposal_id)}/decision`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      out.textContent = `${r.released ? "Released" : "Not released"}: ${r.reason}`; out.className = r.released ? "ok" : "no";
    } catch (e) { out.textContent = `Error: ${e.message}`; out.className = "no"; }
  };
  const accept = el("button", "Approve"), reject = el("button", "Reject", "ghost"), override = el("button", "Override", "ghost");
  accept.onclick = () => decide("accept"); reject.onclick = () => decide("reject"); override.onclick = () => decide("override");
  if (p.tier === "red") row.append(labelled("Second reviewer", second), labelled("Their role", secondRole));
  row.append(accept, reject, labelled("Reason", reason), override);
  wrap.append(row, out); return wrap;
}
const labelled = (text, input) => { const l = el("label", text); l.append(input); return l; };

async function ask(ev) {
  ev.preventDefault();
  const box = $("answer"); box.replaceChildren(el("p", "Thinking...", "muted"));
  try {
    const a = await call("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: $("question").value, ...who() }) });
    box.replaceChildren(); box.className = "";
    if (a.kind === "refusal") { box.append(el("p", a.message, "no")); if (a.suggestion) box.append(el("p", a.suggestion, "muted")); return; }
    if (a.kind === "clarification") { box.append(el("p", a.question)); return; }
    box.append(el("p", a.narrative));
    if (a.columns && a.columns.length) {
      const t = el("table"), hr = el("tr"); a.columns.forEach((c) => hr.append(el("th", c))); t.append(hr);
      a.rows.slice(0, 50).forEach((r) => { const tr = el("tr"); r.forEach((v) => tr.append(el("td", v == null ? "" : String(v)))); t.append(tr); });
      box.append(t);
    }
    (a.citations || []).forEach((c) => box.append(el("p", `${c.document_id} ${c.section}: ${c.snippet}`, "muted")));
    if (a.sql) box.append(el("pre", a.sql));
    box.append(el("p", `Tables: ${a.tables_used.join(", ")}${a.data_freshness ? ` - data as of ${new Date(a.data_freshness).toLocaleString()}` : ""}`, "muted"));
  } catch (e) { box.replaceChildren(el("p", `Ask failed: ${e.message}`, "no")); }
}

async function loadQueue() {
  const box = $("queue"); box.replaceChildren(el("p", "Loading...", "muted"));
  try {
    const items = await call("/steward/queue");
    box.replaceChildren(); box.className = "";
    if (!items.length) { box.append(el("p", "Nothing to review.", "muted")); return; }
    const ul = el("ul", null, "clean");
    items.forEach((i) => {
      const li = el("li", `${i.left_key} vs ${i.right_key} - score ${i.score.toFixed(2)} - ${i.reasons.join("; ")}`);
      ["merge", "split"].forEach((v) => {
        const b = el("button", v, "ghost"); b.style.marginLeft = "6px";
        b.onclick = async () => {
          try { const r = await call(`/steward/items/${encodeURIComponent(i.item_id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ verdict: v, steward_id: who().user_id }) });
                li.textContent = `${i.left_key} vs ${i.right_key}: ${r.status}`; }
          catch (e) { li.append(el("span", ` ${e.message}`, "no")); }
        };
        li.append(b);
      });
      ul.append(li);
    });
    box.append(ul);
  } catch (e) { box.replaceChildren(el("p", `Couldn't load the queue: ${e.message}`, "no")); }
}

$("load").onclick = loadCard;
$("case").addEventListener("keydown", (e) => { if (e.key === "Enter") loadCard(); });
$("askform").addEventListener("submit", ask);
$("loadqueue").onclick = loadQueue;
</script>
</body>
</html>
