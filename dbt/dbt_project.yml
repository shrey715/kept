name: kept
version: "0.1.0"
config-version: 2
profile: kept

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  kept:
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
      +contract:
        enforced: true   # gold models are real: dbt fails a build whose columns or types drift from schema.yml
    features:
      +schema: features
      +materialized: table
      +pre-hook: "set TimeZone = 'UTC'"  # source timestamps are naive UTC (K7)
    text:
      +schema: text
      +materialized: table

vars:
  # Track D features: as_of is naive UTC. Nightly = one as_of; training adds features_start.
  features_as_of: "2026-09-28 06:00:00"
  features_step_days: 7
  feature_set_version: "fs-0.1"
