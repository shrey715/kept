[project]
name = "kept"
version = "0.1.0"
description = "Kept: a guarded next best action for promises customers can keep (Team Sharpe Shooters, CIBC Collections Hackathon)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Garimella Sai Abhishek" },
    { name = "Satvik Rao" },
    { name = "Shreyas Deb" },
    { name = "Akshat Srivastava" },
]
# Core: only what the shared contracts, stubs and tests need. Each track pulls
# its heavy libraries through an extra so nobody has to install everything.
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Shared LLM gateway (Layers 1-3). Every call goes through kept.common.llm.
llm = ["litellm>=1.50"]
# Track A: Layer 1 Data Product Factory
data = [
    "kept[llm]",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8,<1.10",
    "splink>=4.0",
    "soda-core-duckdb>=3.3",
    "setuptools>=70",  # soda-core imports distutils, which Python 3.12 dropped
    "phonenumbers>=8.13",
    "python-dateutil>=2.9",
]
# Track B: Layer 2 Collections Ask
ask = [
    "kept[llm]",
    "sqlglot>=25",
    "lancedb>=0.13",
]
# Track C: Layer 3 text features + governance (fairness)
text = [
    "kept[llm]",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "setfit>=1.1",
    "scikit-learn>=1.5",
    "fairlearn>=0.11",
]
# Track C, first thing we cut if behind (pulls torch).
voice = ["openai-whisper>=20240930"]
# Track D: Layer 3 SQL features + Feast, Layer 4 models and decisioning, app
model = [
    "feast>=0.40",
    "lightgbm>=4.3",
    "shap>=0.45",
    "mlflow>=2.15",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
all = ["kept[data,ask,text,model]"]

[project.scripts]
kept = "kept.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
    "httpx>=0.27",
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kept"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=120"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "track_a: Layer 1 Data Product Factory (Data and IDs)",
    "track_b: Layer 2 Collections Ask",
    "track_c: Layer 3 text features, hardship and fairness",
    "track_d: Layer 3 SQL features / Feast, Layer 4 NBA, app",
    "contract: shared API contract tests (must always be green)",
    "integration: needs a heavy optional dependency or a built warehouse",
    "slow: takes more than a few seconds",
    "perf: latency budgets from the design (card < 300 ms, Ask < 5 s)",
    "todo: a data/config task (not code) the owner must do; tolerated by --allow-stubs",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Tests and the registry favour one-case-per-line tables over wrapping.
"tests/**" = ["E501"]
"src/kept/contracts/feature_registry.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["kept"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["splink.*", "lancedb.*", "litellm.*", "presidio_analyzer.*", "presidio_anonymizer.*", "setfit.*", "feast.*", "lightgbm.*", "shap.*", "mlflow.*", "fairlearn.*", "sqlglot.*", "phonenumbers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["kept"]
branch = true
